scope_note: >-
  This is a documentation-navigation MCP server generated by the Mintlify docs
  platform that hosts developers.kardinal.ai. Its three tools search and read the
  Kardinal documentation corpus (including the OpenAPI spec). It does NOT expose the
  Kardinal ARO API's 40 REST operations as callable tools — an agent can use this
  server to LEARN the API, then must call the REST API directly at
  https://<env>.kardinal.ai/api/v2. See mcp/kardinal-tool-crosswalk.yml.
tools:
- name: search_kardinal_api
  title: Search documentation
  description: >-
    Search across the Kardinal API knowledge base to find relevant information, code
    examples, API references, and guides.
  input_schema:
    query: {type: string, required: true, description: Search query}
    language: {type: string, required: false, description: "Filter to specific language code (e.g. 'zh', 'es'). Defaults to 'en'"}
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
- name: query_docs_filesystem_kardinal_api
  title: Query documentation filesystem
  description: >-
    Run a read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail, jq
    and friends) against a virtualized in-memory filesystem containing only the
    Kardinal API documentation pages and OpenAPI specs.
  input_schema:
    command: {type: string, required: true, description: A shell command to run against the virtualized documentation filesystem}
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
- name: submit_feedback
  title: Submit documentation feedback
  description: Report a problem with this documentation site so the docs team can fix it.
  input_schema:
    path: {type: string, required: true, description: The documentation page path the feedback is about}
    feedback: {type: string, required: true, description: A clear description of the documentation issue or suggestion}
  annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: true}
