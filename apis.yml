aid: kardinal
name: Kardinal
description: >-
  Kardinal is a Paris-based logistics optimization company whose Always-on Route
  Optimization (ARO) API solves vehicle routing problems for last-mile delivery,
  post and parcel, waste and bulk transport, fresh delivery, field services and
  retail operators. Integrators submit a plan — resources (vehicles), orders
  (stops) and constraints such as capacities, time windows, driver skills and
  breaks — with a single idempotent PUT, and the engine optimizes it continuously
  rather than in a nightly batch, so new orders, cancellations, traffic and field
  updates are absorbed into the running solution instead of forcing a rerun. The
  REST API is documented with a published OpenAPI 3.0.3 definition covering 40
  operations across authentication, plans, resources, orders and solutions, and is
  reachable per customer environment at https://<env>.kardinal.ai/api/v2 using
  short-lived JWT bearer tokens.
