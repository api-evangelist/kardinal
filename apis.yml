apis:
- aid: kardinal:aro
  name: Kardinal ARO API
  description: >-
    The Kardinal Always-on Route Optimization (ARO) v2 REST API. Create and update
    optimization plans, manage the resources (vehicles) and orders (stops) inside
    them, drive the optimization lifecycle, and retrieve the computed solution with
    per-resource tours, waypoint arrival times, objectives and unaffected stops.
    Authentication is JWT bearer, with password login, MFA/OTP, Azure and Google SSO,
    and a refresh-token flow. Access is provisioned by invitation per customer
    environment; there is no self-serve sign-up.
  humanURL: https://developers.kardinal.ai/
  baseURL: https://app.kardinal.ai/api/v2
