agent_guidance:
- >-
  Match on `code`, never on HTTP status alone — seven distinct codes share HTTP 400.
- >-
  Match on `code`, never on the response NAME in the OpenAPI reference: a 403 is
  documented under both "Forbidden" and "Unauthorized" depending on the endpoint, but
  both behave identically (HTTP 403, code NOT_ALLOWED).
- >-
  An infeasible plan is NOT an error. Submitting a plan the engine cannot fully
  satisfy still returns 200/201; unplanned stops surface in the solution as
  `unaffectedStopIds` and constraint violations, not as an Error object.
- >-
  Do not assume this list is exhaustive across versions. The provider states the
  codes are compiled from the current server implementation and are NOT exposed as a
  formal enum on the Error.code field in the spec schema.
known_gaps:
- >-
  `Error.code` is not constrained by an `enum` in the OpenAPI, so a generated client
  cannot validate codes against the spec.
- >-
  The `properties` object keys are undocumented per code and the provider marks them
  as informational and not stable pending backend confirmation.
- >-
  The 429 returned by the OTP resend endpoints (/auth/mfa/resendOTP,
  /login/resendOTP) does NOT use the EnvelopedErrors format and currently returns no
  structured JSON body.
- >-
  In the OpenAPI itself the Error and EnvelopedErrors schema descriptions are still
  the placeholder string "[TO_VALIDATE] Description pending review by a Kardinal
  engineer."
