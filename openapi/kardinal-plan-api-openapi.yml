    ObjectivesEnum:
      type: string
      enum:
      - maximizeMandatoryStops
      - minimizeDelay
      - minimizeCosts
      - minimizeResources
      - minimizeOverOverlappingCapacitiesOnStops
      - maximizeOptionalStops
      - maximizePreferredStops
      - minimizeLargestTourDuration
      - minimizeWorkingDuration
      - minimizeDistance
      - minimizeEarlyLoadings
      description: "The available optimization objectives, processed lexicographically in the order provided in Plan.objectives:\n  - maximizeMandatoryStops: Maximizes the number of mandatory stops (\"optional\": false) planned. Should generally be first in the list to ensure at least some planning.\n  - minimizeResources: Minimizes the number of resources used without violating constraints or degrading higher-priority objectives. Should not be first, as the optimal solution might otherwise be to use no resources.\n  - minimizeWorkingDuration: Minimizes the total working time of the routes, including travel, service, breaks, and waiting times.\n  - minimizeDistance: Minimizes the total distance traveled by all routes.\n  - minimizeDelay: Minimizes the total delay across all planned stops, calculated as the difference between the planned time and the end of the preferred time window.\n  - minimizeCosts: Minimizes the total cost of resources, considering factors like distance, working time, and the number of planned orders. See the Cost schema for the available cost components.\n  - maximizeOptionalStops: Maximizes the number of optional orders (\"optional\": true) planned, without violating constraints or degrading higher-priority objectives. Typically placed after minimizeResources.\n  - maximizePreferredStops: Maximizes the assignment of preferred stops to resources based on matching preferredStopTags / tags.\n  - minimizeOverOverlappingCapacitiesOnStops: Minimizes the number of vehicles present simultaneously at stops with overlapping capacities (e.g. limited cross-docking capacity). May cause optimization delays; use only if necessary.\n  - minimizeLargestTourDuration and minimizeEarlyLoadings: additional objectives; see Kardinal support for details on these two.\n"
    Resource:
      type: object
      properties:
        id:
          description: Resource ids must be unique within a plan.
          allOf:
          - $ref: '#/components/schemas/RegexIdValidation'
        properties:
          $ref: '#/components/schemas/Properties'
          description: Free-form key-value pairs (strings only) with no impact on optimization, such as the driver's name. Returned unchanged in the plan and its solution.
        state:
          allOf:
          - $ref: '#/components/schemas/State'
          description: '[TO_VALIDATE] Believed to describe the resource''s manual-mode state (current mode and any forced stop/break assignments), used by the manual planning endpoints. Needs confirmation.'
        cost:
          allOf:
          - $ref: '#/components/schemas/Cost'
          description: Defines a custom cost model for this resource (for example per kilometer, per capacity unit transported, or a fixed cost), used by the minimizeCosts objective. See the Cost schema below for every available cost component and its semantics.
        CO2EmissionCalculation:
          description: "Optional CO2 emission calculation parameters for this resource. The object is `Cost`-shaped.\nTypical fields:\n  - `km`: emission per travelled kilometre (e.g. `costCoeff` in g/km);\n  - `costPerCapacityPerTravelledKm`: per-capacity emission per travelled kilometre;\n  - `costPerCapacityPerTravelledHour`: per-capacity emission per travel hour (travel duration only).\nWhen set, the resulting emissions are reported on the tour as `CO2Emission`.\nTakes precedence over any matching plan-level declaration.\n"
          allOf:
          - $ref: '#/components/schemas/Cost'
          example:
            km:
              costCoeff: 0.55
            costPerCapacityPerTravelledKm:
              weight:
                costCoeff: 0.2
            costPerCapacityPerTravelledHour:
              weight:
                costCoeff: 0.05
        priority:
          description: 0 by default, can be negative.
          type: integer
          default: 0
        skills:
          type: array
          uniqueItems: true
          items:
            type: string
            allOf:
            - $ref: '#/components/schemas/RegexIdValidation'
          example:
          - forklift
          - truck
        preferredStopTags:
          type: array
          items:
            type: string
            allOf:
            - $ref: '#/components/schemas/RegexIdValidation'
          uniqueItems: true
          example:
          - access:parking33
          - capa:bat22
          - setup:france
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            allOf:
            - $ref: '#/components/schemas/RegexIdValidation'
          example:
          - trailer
        vehicleProfile:
          oneOf:
          - $ref: '#/components/schemas/VehicleProfileFly'
          - $ref: '#/components/schemas/VehicleProfilePedestrian'
          - $ref: '#/components/schemas/VehicleProfileBicycle'
          - $ref: '#/components/schemas/VehicleProfileScooter'
          - $ref: '#/components/schemas/VehicleProfileMotorbike'
          - $ref: '#/components/schemas/VehicleProfileCar'
          - $ref: '#/components/schemas/VehicleProfileTruck'
          description: 'Describes how this resource travels between stops: the mode of transport and its constraints. One of fly, pedestrian, bicycle, scooter, motorbike, car, or truck, each exposing different parameters (for example traffic sensitivity, weight, or hazardous goods restrictions).'
        capacities:
          allOf:
          - $ref: '#/components/schemas/Capacities'
          description: The carrying capacity of the resource, as free-form key-value pairs (for example weight, volume, or temperature zones). The same capacity keys must also be declared on eligible stops for the algorithm to assign them to this resource.
        departure:
          allOf:
          - $ref: '#/components/schemas/Position'
          description: The starting location of the resource's route, typically a home or depot. If omitted, the algorithm assumes working time starts from the first visited stop.
        arrival:
          oneOf:
          - $ref: '#/components/schemas/Position'
          - $ref: '#/components/schemas/AtFirstPositionArrival'
          description: The ending location of the resource's route, typically a home or depot. If omitted, the algorithm assumes working time ends at the last visited stop.
        workingTimeWindow:
          allOf:
          - $ref: '#/components/schemas/TimeWindow'
          description: The time window during which the resource is available to work. Often used together with maxWorkingDuration.
        maxWorkingDuration:
          allOf:
          - $ref: '#/components/schemas/Duration'
        maxDistanceInKm:
          type: number
          description: The maximum distance the resource can travel, used to constrain its service area.
        maxInterStopDistanceInKm:
          description: "Maximum distance, in km, between two consecutive stops on a tour.\nAccepts either:\n  - a scalar value — applied uniformly to every travel of the tour;\n  - a structured object with independent bounds per segment (`firstTravel`, `interStop`, `lastTravel`); an absent key means no constraint on that segment.\n"
          oneOf:
          - type: number
            description: Uniform bound, in km, applied to every travel of the tour.
            example: 50
          - $ref: '#/components/schemas/MaxInterStopDistanceInKmBounds'
        maxInterStopDuration:
          description: "Maximum duration between two consecutive stops on a tour.\nAccepts either:\n  - a scalar value — applied uniformly to every travel of the tour;\n  - a structured object with independent bounds per segment (`firstTravel`, `interStop`, `lastTravel`); an absent key means no constraint on that segment.\n"
          oneOf:
          - $ref: '#/components/schemas/Duration'
          - $ref: '#/components/schemas/MaxInterStopDurationBounds'
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/Break'
          description: The breaks (lunch, legal driving/working breaks, etc.) the resource must take during its working time window. Breaks count as working time unless stated otherwise.
        operationDurationPolicies:
          type: array
          items:
            $ref: '#/components/schemas/OperationDurationPolicy'
        travelTimeCoefficient:
          type: number
          format: float
          example: 1.05
          description: '[TO_VALIDATE] Believed to be a multiplier applied to this resource''s travel time calculations. Exact behavior needs confirmation.'
        emptyThresholdByCapacity:
          description: 'Thresholds for capacities below which a resource is considered "empty" for empty distance calculation.

            A resource is "empty" (kilometers traveled count as empty distance) when all capacities are at or below their threshold.

            '
          allOf:
          - $ref: '#/components/schemas/Capacities'
          example:
            weight: 100.0
            volume: 50.0
        avoidEarlyLoadings:
          type: array
          description: Early loading declarations for this resource. Each entry identifies a stop tag and optional capacities used to compute the minimizeEarlyLoadings objective.
          items:
            $ref: '#/components/schemas/AvoidEarlyLoading'
      required:
