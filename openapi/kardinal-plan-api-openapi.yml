      description: The plan mode.
      in: query
      schema:
        $ref: '#/components/schemas/PlanMode'
    page:
      name: page
      description: The page number of a paginated list of records.
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    limit:
      name: limit
      description: 'The number of items to fetch. The value should be a positive integer

        and if the limit is set to 0, all items will be fetched.

        '
      in: query
      required: false
      schema:
        type: integer
        example: 5
        default: 5
        minimum: 0
    archived:
      name: archived
      description: Indicates if and how archived items should be part of the result.
      in: query
      schema:
        type: string
        enum:
        - excluded
        - included
        - only
        default: excluded
    force:
      name: force
      description: If true, on an archived item, the requested action will be forced and the item will be unarchived.
      in: query
      schema:
        type: boolean
        default: false
    agencyId:
      name: agencyId
      description: The agency id.
      in: path
      required: true
