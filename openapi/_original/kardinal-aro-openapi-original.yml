      description: Tunnel category restriction for truck routing (ADR tunnel categories)

    TaggedCostFloorsAndCoeffs:
      type: object
      allOf:
        - $ref: "#/components/schemas/CostFloorsAndCoeffs"
      properties:
        stopTags:
          type: array
          items:
            type: string
            allOf:
              - $ref: "#/components/schemas/RegexIdValidation"
          uniqueItems: true
          example: ["warehouse", "stop"]

    CostFloorsAndCoeffs:
      type: object
      description: Cost floors and coefficients. A cost cannot be empty. An overcost cannot be set if there is no cost, and the overcostFloor must be greater than costFloor.
      properties:
        constantCost:
          type: number
          description: A one-off cost added once whenever this cost component applies, independent of any measured quantity (distance, duration, or capacity) — use it for a flat charge that doesn't scale with usage.
        costFloor:
          type: number
          description: The quantity (distance, duration, or capacity — whatever this object is scoped to) below which no cost accrues from this component. `costCoeff` applies only to the portion of the quantity above this floor.
        costCoeff:
          type: number
          description: The rate charged per unit of quantity above `costFloor` (for example cost per km, per hour, or per capacity unit) — the linear component of this cost.
        overcostFloor:
          type: number
          description: A second, higher quantity threshold at which the `overcostCoeff` rate starts applying instead of `costCoeff`, for the portion of the quantity above this threshold (for example an overtime-style tariff beyond a normal-usage allowance). Must be strictly greater than `costFloor`, and can only be set alongside `overcostCoeff`.
        overcostCoeff:
          type: number
          description: The rate charged per unit of quantity above `overcostFloor` — the higher, second-tier rate for usage beyond the range already covered by `costFloor`/`costCoeff`. Requires `overcostFloor` to also be set.
    Cost:
      type: object
      properties:
        workedHours:
          $ref: "#/components/schemas/CostFloorsAndCoeffs"
        km:
          $ref: "#/components/schemas/CostFloorsAndCoeffs"
        using:
          type: number
          description: A one-off, fixed cost added once per resource that carries this cost object and is used in the plan (for example a flat dispatch or vehicle-assignment charge) — independent of distance, duration, or transported capacity, and contributed once per resource rather than per unit of any other quantity.
        costsByStopTag:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CostFloorsAndCoeffs"
          description: '[TO_VALIDATE] Description pending review by a Kardinal engineer.'
        costsByCapacity:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TaggedCostFloorsAndCoeffs"
          description: '[TO_VALIDATE] Description pending review by a Kardinal engineer.'
        costPerCapacityPerTravelledKm:
          type: object
          description: |
            Contribution to cost proportional to travelled distance and transported capacity.
            For each capacity, the contribution is `costCoeff × distance(km) × transportedCapacity`.
            Unit: cost per capacity unit per kilometre (e.g. €/tonne/km).
            Cumulable with `costPerCapacityPerTravelledHour` and with the other cost fields; the two travelled-cost maps are independent.
          additionalProperties:
            $ref: "#/components/schemas/CostFloorsAndCoeffs"
          example:
            weight: {costCoeff: 0.2}
            volume: {costCoeff: 0.1}
        costPerCapacityPerTravelledHour:
          type: object
          description: |
            Contribution to cost proportional to travel duration and transported capacity.
            For each capacity, the contribution is `costCoeff × travelDuration(h) × transportedCapacity`.
            Unit: cost per capacity unit per hour (e.g. €/tonne/h).
            The `Travelled` qualifier means travel duration only — not total working time.
            Cumulable with `costPerCapacityPerTravelledKm` and with the other cost fields; the two travelled-cost maps are independent.
          additionalProperties:
            $ref: "#/components/schemas/CostFloorsAndCoeffs"
          example:
            weight: {costCoeff: 0.05}
      description: A composable cost model used by the minimizeCosts objective — every field set on this object (`workedHours`, `km`, `using`, and the per-stop-tag / per-capacity / per-travelled maps) contributes its own component, and the components of every populated field are summed to produce the total, rather than being mutually exclusive alternatives.

