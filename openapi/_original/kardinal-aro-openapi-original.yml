      description: '[TO_VALIDATE] Description pending review by a Kardinal engineer.'
    MaxInterStopDistanceInKmBounds:
      type: object
      description: |
        Per-segment maximum distance, in km, between two consecutive stops on a tour.
        Each key is independent; an absent key means no constraint on that segment.
      properties:
        firstTravel:
          description: Maximum distance, in km, between the resource's departure and the first stop.
          type: number
        interStop:
          description: Maximum distance, in km, between two consecutive intermediate stops (excluding the first and last travels).
          type: number
        lastTravel:
          description: Maximum distance, in km, between the last stop and the resource's arrival.
          type: number
      example:
        firstTravel: 10
        interStop: 25
        lastTravel: 15

    MaxInterStopDurationBounds:
      type: object
      description: |
        Per-segment maximum duration between two consecutive stops on a tour.
        Each key is independent; an absent key means no constraint on that segment.
      properties:
        firstTravel:
          description: Maximum duration between the resource's departure and the first stop.
          allOf:
            - $ref: "#/components/schemas/Duration"
        interStop:
          description: Maximum duration between two consecutive intermediate stops (excluding the first and last travels).
          allOf:
            - $ref: "#/components/schemas/Duration"
        lastTravel:
          description: Maximum duration between the last stop and the resource's arrival.
          allOf:
            - $ref: "#/components/schemas/Duration"
      example:
        firstTravel: PT15M
        interStop: PT30M
        lastTravel: PT20M

    Resource:
      type: object
      properties:
        id:
          description: Resource ids must be unique within a plan.
          allOf:
            - $ref: "#/components/schemas/RegexIdValidation"
        properties:
          $ref: "#/components/schemas/Properties"
          description: Free-form key-value pairs (strings only) with no impact on optimization, such as the driver's name. Returned unchanged in the plan and its solution.
        state:
          allOf:
            - $ref: "#/components/schemas/State"
          description: "[TO_VALIDATE] Believed to describe the resource's manual-mode state (current mode and any forced stop/break assignments), used by the manual planning endpoints. Needs confirmation."
        cost:
          allOf:
            - $ref: "#/components/schemas/Cost"
          description: Defines a custom cost model for this resource (for example per kilometer, per capacity unit transported, or a fixed cost), used by the minimizeCosts objective. See the Cost schema below for every available cost component and its semantics.
        CO2EmissionCalculation:
          description: |
            Optional CO2 emission calculation parameters for this resource. The object is `Cost`-shaped.
            Typical fields:
              - `km`: emission per travelled kilometre (e.g. `costCoeff` in g/km);
              - `costPerCapacityPerTravelledKm`: per-capacity emission per travelled kilometre;
              - `costPerCapacityPerTravelledHour`: per-capacity emission per travel hour (travel duration only).
            When set, the resulting emissions are reported on the tour as `CO2Emission`.
            Takes precedence over any matching plan-level declaration.
          allOf:
            - $ref: "#/components/schemas/Cost"
          example:
            km: {costCoeff: 0.55}
            costPerCapacityPerTravelledKm:
              weight: {costCoeff: 0.2}
            costPerCapacityPerTravelledHour:
              weight: {costCoeff: 0.05}
        priority:
          description: 0 by default, can be negative.
          type: integer
          default: 0
        skills:
          type: array
          uniqueItems: true
          items:
            type: string
            allOf:
              - $ref: "#/components/schemas/RegexIdValidation"
          example: ["forklift", "truck"]
        preferredStopTags:
          type: array
          items:
            type: string
            allOf:
              - $ref: "#/components/schemas/RegexIdValidation"
          uniqueItems: true
          example: ["access:parking33", "capa:bat22", "setup:france"]
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            allOf:
              - $ref: "#/components/schemas/RegexIdValidation"
          example: ["trailer"]
        vehicleProfile:
          oneOf:
            - $ref: "#/components/schemas/VehicleProfileFly"
            - $ref: "#/components/schemas/VehicleProfilePedestrian"
            - $ref: "#/components/schemas/VehicleProfileBicycle"
            - $ref: "#/components/schemas/VehicleProfileScooter"
            - $ref: "#/components/schemas/VehicleProfileMotorbike"
            - $ref: "#/components/schemas/VehicleProfileCar"
            - $ref: "#/components/schemas/VehicleProfileTruck"
          description: 'Describes how this resource travels between stops: the mode of transport and its constraints. One of fly, pedestrian, bicycle, scooter, motorbike, car, or truck, each exposing different parameters (for example traffic sensitivity, weight, or hazardous goods restrictions).'
        capacities:
          allOf:
            - $ref: "#/components/schemas/Capacities"
          description: The carrying capacity of the resource, as free-form key-value pairs (for example weight, volume, or temperature zones). The same capacity keys must also be declared on eligible stops for the algorithm to assign them to this resource.
        departure:
          allOf:
            - $ref: "#/components/schemas/Position"
          description: The starting location of the resource's route, typically a home or depot. If omitted, the algorithm assumes working time starts from the first visited stop.
        arrival:
          oneOf:
            - $ref: "#/components/schemas/Position"
            - $ref: "#/components/schemas/AtFirstPositionArrival"
          description: The ending location of the resource's route, typically a home or depot. If omitted, the algorithm assumes working time ends at the last visited stop.
        workingTimeWindow:
          allOf:
            - $ref: "#/components/schemas/TimeWindow"
          description: The time window during which the resource is available to work. Often used together with maxWorkingDuration.
        maxWorkingDuration:
          allOf:
            - $ref: "#/components/schemas/Duration"
        maxDistanceInKm:
          type: number
          description: The maximum distance the resource can travel, used to constrain its service area.
        maxInterStopDistanceInKm:
          description: |
            Maximum distance, in km, between two consecutive stops on a tour.
            Accepts either:
              - a scalar value — applied uniformly to every travel of the tour;
              - a structured object with independent bounds per segment (`firstTravel`, `interStop`, `lastTravel`); an absent key means no constraint on that segment.
          oneOf:
            - type: number
              description: Uniform bound, in km, applied to every travel of the tour.
              example: 50
            - $ref: "#/components/schemas/MaxInterStopDistanceInKmBounds"
        maxInterStopDuration:
          description: |
            Maximum duration between two consecutive stops on a tour.
            Accepts either:
              - a scalar value — applied uniformly to every travel of the tour;
              - a structured object with independent bounds per segment (`firstTravel`, `interStop`, `lastTravel`); an absent key means no constraint on that segment.
          oneOf:
            - $ref: "#/components/schemas/Duration"
            - $ref: "#/components/schemas/MaxInterStopDurationBounds"
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/Break"
          description: The breaks (lunch, legal driving/working breaks, etc.) the resource must take during its working time window. Breaks count as working time unless stated otherwise.
        operationDurationPolicies:
          type: array
          items:
            $ref: "#/components/schemas/OperationDurationPolicy"
        travelTimeCoefficient:
          type: number
          format: float
          example: 1.05
          description: "[TO_VALIDATE] Believed to be a multiplier applied to this resource's travel time calculations. Exact behavior needs confirmation."
        emptyThresholdByCapacity:
          description: |
            Thresholds for capacities below which a resource is considered "empty" for empty distance calculation.
            A resource is "empty" (kilometers traveled count as empty distance) when all capacities are at or below their threshold.
          allOf:
            - $ref: "#/components/schemas/Capacities"
          example: {"weight": 100.0, "volume": 50.0}
        avoidEarlyLoadings:
          type: array
          description: Early loading declarations for this resource. Each entry identifies a stop tag and optional capacities used to compute the minimizeEarlyLoadings objective.
          items:
            $ref: "#/components/schemas/AvoidEarlyLoading"
      required:
        - id
        - vehicleProfile
        - workingTimeWindow

      description: '[TO_VALIDATE] Description pending review by a Kardinal engineer.'
    EnvelopedResource:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/Resource"
        agencyId:
          $ref: "#/components/schemas/AgencyId"
        planId:
          $ref: "#/components/schemas/PlanId"
