        avoidControlledAccessHighway:
          type: boolean
          description: When true, avoids controlled-access highways (e.g. motorways).
        avoidCarShuttleTrain:
          type: boolean
          description: When true, avoids routes requiring a car shuttle train.
        avoidTunnel:
          type: boolean
          description: When true, avoids tunnels.
        avoidDirtRoad:
          type: boolean
          description: When true, avoids unpaved or dirt roads.
        avoidUTurns:
          type: boolean
          description: When true, avoids U-turns when calculating routes.
        shippedHazardousGoods:
          type: array
          items:
            $ref: "#/components/schemas/ShippedHazardousGood"
          example: ["explosive", "gas", "flammable"]
          description: The list of hazardous goods restrictions carried by the vehicle (for example explosive, gas, flammable, combustible, organic, poison, radioactive, corrosive, poisonousInhalation, harmfulToWater, other), used to respect road transport restrictions.
        excludedCountries:
          $ref: "#/components/schemas/CountryCodes"
          description: The list of countries to exclude from calculated routes.
        height:
          type: number
          description: The vehicle's height in meters, used to respect road height restrictions.
        width:
          type: number
          description: The vehicle's width in meters, used to respect road width restrictions.
        length:
          type: number
          description: The vehicle's length in meters, used to respect road length restrictions.
        tunnelCategory:
          $ref: "#/components/schemas/TunnelCategory"
          description: The vehicle's tunnel restriction category (relevant for hazardous goods transport), used to respect tunnel access restrictions.
        speedCap:
          type: number
          description: Caps the vehicle's maximum speed used in travel time calculations, in km/h.
      required:
        - type

      description: A heavy-weight vehicle profile. Affected by both traffic variations and road restrictions (weight, height, hazardous goods, etc.).
